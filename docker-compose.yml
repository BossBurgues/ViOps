services:
  postgres:
    image: postgres:16-alpine
    container_name: viops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-viops}
      POSTGRES_USER: ${POSTGRES_USER:-viops_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viops_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - viops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-viops_dev} -d ${POSTGRES_DB:-viops}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  viops_postgres_data:
